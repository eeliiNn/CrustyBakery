<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Pagos del pedido')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container">
        <div class="page-header">
            <h1>Pagos del pedido #<span th:text="${pedidoId}"></span></h1>
            <a th:href="@{/pedidos/{id}(id=${pedidoId})}" class="btn">Ver pedido</a>
        </div>

        <p th:if="${mensaje}" th:text="${mensaje}" class="alert alert-info"></p>

        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Monto</th>
                    <th>Metodo de pago</th>
                    <th>Fecha</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pago : ${pagos}">
                    <td th:text="${pago.id}"></td>
                    <td th:text="${pago.monto}"></td>
                    <td th:text="${pago.metodoPago}"></td>
                    <td th:text="${pago.fechaPago}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(pagos)}">
                    <td colspan="4">Aun no hay pagos registrados para este pedido.</td>
                </tr>
            </tbody>
        </table>

        <section class="card">
            <h2>Registrar pago</h2>
            <form th:action="@{/ventas/{id}/pagos/registrar(id=${pedidoId})}" th:object="${nuevoPago}"
                  method="post" class="form-inline">
                <input type="number" step="0.01" min="0" th:field="*{monto}" placeholder="Monto" required>
                <select th:field="*{metodoPago}" required>
                    <option value="EFECTIVO">EFECTIVO</option>
                    <option value="TARJETA">TARJETA</option>
                    <option value="TRANSFERENCIA">TRANSFERENCIA</option>
                </select>
                <button type="submit" class="btn btn-primary">Registrar pago</button>
            </form>
        </section>
    </main>
</body>
</html>
