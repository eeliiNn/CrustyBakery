<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Detalle del pedido')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container">
        <div class="page-header">
            <h1>Pedido #<span th:text="${pedido.id}"></span></h1>
            <a th:href="@{/ventas/{id}/pagos(id=${pedido.id})}" class="btn">Ver pagos</a>
        </div>

        <p th:if="${mensaje}" th:text="${mensaje}" class="alert alert-info"></p>

        <section class="card">
            <p><strong>Cliente:</strong> <span th:text="${pedido.clienteNombre}"></span></p>
            <p><strong>Fecha:</strong> <span th:text="${pedido.fechaPedido}"></span></p>
            <p><strong>Estado actual:</strong> <span class="badge" th:text="${pedido.estado}"></span></p>
            <p><strong>Total:</strong> <span th:text="${pedido.total}"></span></p>
        </section>

        <section class="card">
            <h2>Cambiar estado</h2>
            <form th:action="@{/pedidos/{id}/estado(id=${pedido.id})}" method="post" class="form-inline">
                <select name="estado" required>
                    <option value="PENDIENTE">PENDIENTE</option>
                    <option value="EN_PREPARACION">EN_PREPARACION</option>
                    <option value="LISTO">LISTO</option>
                    <option value="ENTREGADO">ENTREGADO</option>
                    <option value="CANCELADO">CANCELADO</option>
                </select>
                <button type="submit" class="btn btn-primary">Actualizar estado</button>
            </form>
        </section>

        <section class="card">
            <h2>Productos del pedido</h2>
            <table class="table">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio unitario</th>
                        <th>Subtotal</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="detalle : ${pedido.detalles}">
                        <td th:text="${detalle.productoNombre}"></td>
                        <td th:text="${detalle.cantidad}"></td>
                        <td th:text="${detalle.precioUnitario}"></td>
                        <td th:text="${detalle.subtotal}"></td>
                        <td class="acciones">
                            <form th:action="@{/pedidos/{id}/detalles/{detalleId}/eliminar(id=${pedido.id},detalleId=${detalle.id})}"
                                  method="post" onsubmit="return confirm('Quitar este producto del pedido?');" class="inline-form">
                                <button type="submit" class="btn btn-sm btn-danger">Quitar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pedido.detalles)}">
                        <td colspan="5">Aun no se han agregado productos.</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="card">
            <h2>Agregar producto</h2>
            <form th:action="@{/pedidos/{id}/detalles/agregar(id=${pedido.id})}" th:object="${nuevoDetalle}"
                  method="post" class="form-inline">
                <select th:field="*{productoId}" required>
                    <option value="">-- Producto --</option>
                    <option th:each="producto : ${productos}"
                            th:value="${producto.id}"
                            th:text="${producto.nombre} + ' (' + ${producto.precio} + ')'"></option>
                </select>
                <input type="number" th:field="*{cantidad}" min="1" placeholder="Cantidad" required>
                <button type="submit" class="btn btn-primary">Agregar</button>
            </form>
        </section>
    </main>
</body>
</html>
