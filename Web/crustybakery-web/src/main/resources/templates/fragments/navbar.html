<nav th:fragment="navbar" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
     class="navbar">
    <div class="navbar-brand">
        <a th:href="@{/dashboard}">
            <img th:src="@{/images/logo.png}" alt="Crustybakery" class="navbar-logo">
            <span>Sweet &amp; Tasty</span>
        </a>
    </div>
    <ul class="navbar-links">
        <li><a th:href="@{/dashboard}">Dashboard</a></li>

        <li sec:authorize="hasAnyRole('ADMINISTRADOR','REPOSTERO')">
            <a th:href="@{/categorias}">Categorias</a>
        </li>
        <li sec:authorize="hasAnyRole('ADMINISTRADOR','REPOSTERO')">
            <a th:href="@{/productos}">Productos</a>
        </li>

        <li sec:authorize="hasAnyRole('ADMINISTRADOR','EMPLEADO')">
            <a th:href="@{/clientes}">Clientes</a>
        </li>
        <li sec:authorize="hasAnyRole('ADMINISTRADOR','EMPLEADO')">
            <a th:href="@{/pedidos}">Pedidos</a>
        </li>
        <li sec:authorize="hasAnyRole('ADMINISTRADOR','EMPLEADO')">
            <a th:href="@{/ventas}">Ventas</a>
        </li>

        <li sec:authorize="hasRole('ADMINISTRADOR')">
            <a th:href="@{/usuarios}">Usuarios</a>
        </li>
    </ul>
    <div class="navbar-user">
        <span sec:authentication="name">usuario</span>
        (<span sec:authentication="principal.rol">ROL</span>)
        <form th:action="@{/auth/logout}" method="post" class="logout-form">
            <button type="submit">Cerrar sesion</button>
        </form>
    </div>
</nav>
