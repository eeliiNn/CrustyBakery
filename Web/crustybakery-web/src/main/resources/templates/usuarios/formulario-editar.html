<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Editar usuario')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container">
        <h1>Editar usuario: <span th:text="${usuario.correo}"></span></h1>

        <form th:action="@{/usuarios/{id}/actualizar(id=${usuario.id})}" th:object="${usuarioUpdate}"
              method="post" class="form">

            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" th:field="*{nombre}" th:value="${usuario.nombre}" required>
            </div>

            <div class="form-group">
                <label for="rol">Rol</label>
                <select id="rol" th:field="*{rol}">
                    <option value="ADMINISTRADOR" th:selected="${usuario.rol == 'ADMINISTRADOR'}">ADMINISTRADOR</option>
                    <option value="EMPLEADO" th:selected="${usuario.rol == 'EMPLEADO'}">EMPLEADO</option>
                    <option value="REPOSTERO" th:selected="${usuario.rol == 'REPOSTERO'}">REPOSTERO</option>
                </select>
            </div>

            <div class="form-group">
                <label for="telefono">Telefono</label>
                <input type="text" id="telefono" th:field="*{telefono}" th:value="${usuario.telefono}">
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" th:field="*{activo}" th:checked="${usuario.activo}">
                    Usuario activo
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                <a th:href="@{/usuarios}" class="btn">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
