<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Producto')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container">
        <h1 th:text="${producto.id} != null ? 'Editar producto' : 'Nuevo producto'"></h1>

        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="form">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}" required>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripcion</label>
                <textarea id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="categoriaId">Categoria</label>
                <select id="categoriaId" th:field="*{categoriaId}" required>
                    <option value="">-- Selecciona --</option>
                    <option th:each="categoria : ${categorias}"
                            th:value="${categoria.id}"
                            th:text="${categoria.nombre}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="precio">Precio</label>
                <input type="number" step="0.01" min="0" id="precio" th:field="*{precio}" required>
            </div>

            <div class="form-group">
                <label for="imagenUrl">URL de imagen</label>
                <input type="text" id="imagenUrl" th:field="*{imagenUrl}">
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" th:field="*{disponible}" th:checked="${producto.disponible}">
                    Disponible en el catalogo
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/productos}" class="btn">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
