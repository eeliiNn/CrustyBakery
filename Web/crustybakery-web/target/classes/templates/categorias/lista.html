<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Categorias')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container">
        <div class="page-header">
            <h1>Categorias</h1>
            <a th:href="@{/categorias/nueva}" class="btn btn-primary">Nueva categoria</a>
        </div>

        <p th:if="${mensaje}" th:text="${mensaje}" class="alert alert-info"></p>

        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripcion</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="categoria : ${categorias}">
                    <td th:text="${categoria.id}"></td>
                    <td th:text="${categoria.nombre}"></td>
                    <td th:text="${categoria.descripcion}"></td>
                    <td class="acciones">
                        <a th:href="@{/categorias/{id}/editar(id=${categoria.id})}" class="btn btn-sm">Editar</a>
                        <form th:action="@{/categorias/{id}/eliminar(id=${categoria.id})}" method="post"
                              onsubmit="return confirm('Eliminar esta categoria?');" class="inline-form">
                            <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(categorias)}">
                    <td colspan="4">No hay categorias registradas.</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
